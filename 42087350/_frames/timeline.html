<!doctype html><html lang=ko><head><meta charset=utf-8>
<style>
@import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#F4F4F1}
body{font-family:'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif;color:#1E1E1C;-webkit-font-smoothing:antialiased}
#bg{position:absolute;inset:-6%;background:#F4F4F1;
  animation:drift 14.5s ease-in-out forwards}
@keyframes drift{from{transform:scale(1.01)}to{transform:scale(1.08) translateY(-1.4%)}}
section{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:210px 60px 350px;text-align:center;
  word-break:keep-all;white-space:nowrap;opacity:0;
  animation-name:seg;animation-timing-function:linear;animation-fill-mode:both}
section.first{animation-name:segfirst} section.first .hook{animation:none}
@keyframes segfirst{0%,87%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-18px) scale(.99)}}
body.wait *{animation-play-state:paused!important}
@keyframes seg{
  0%{opacity:0;transform:translateY(22px) scale(.985)}
  8%{opacity:1;transform:none}
  87%{opacity:1;transform:none}
  100%{opacity:0;transform:translateY(-18px) scale(.99)}
}
.kick{font-family:'Gowun Batang', 'Apple SD Gothic Neo', serif;font-weight:700;font-size:31px;color:#2F5D50;
  letter-spacing:.06em;opacity:.85;margin-bottom:52px;
  animation:kickin .55s cubic-bezier(.16,1,.3,1) both}
@keyframes kickin{from{opacity:0;letter-spacing:.02em}to{opacity:.85;letter-spacing:.06em}}
.tx{animation:rise .55s cubic-bezier(.16,1,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.hook{font-family:'Gowun Batang', 'Apple SD Gothic Neo', serif;font-weight:700;font-size:72px;line-height:1.32;letter-spacing:-.015em;
  animation:hookin .7s cubic-bezier(.16,1,.3,1) both}
@keyframes hookin{from{opacity:0;transform:translateY(30px) scale(.92)}to{opacity:1;transform:none}}
.lead{font-size:50px;line-height:1.4;font-weight:700;color:#1F4037;margin:8px 0 18px}
.sub{font-size:42px;line-height:1.46;font-weight:500;opacity:.86;margin:8px 0}
.take{font-family:'Gowun Batang', 'Apple SD Gothic Neo', serif;font-weight:700;font-size:57px;line-height:1.5;color:#1F4037;margin:10px 0;
  letter-spacing:-.015em}
.cta{font-family:'Gowun Batang', 'Apple SD Gothic Neo', serif;font-weight:700;font-size:50px;line-height:1.4;opacity:.9}
mark{background:none;color:inherit;position:relative;white-space:nowrap;padding:0 .06em}
mark::before{content:"";position:absolute;left:0;right:0;bottom:.05em;top:.16em;z-index:-1;
  background:#2F5D50;opacity:.2;transform:scaleX(0);transform-origin:left;border-radius:2px;
  animation:sweep .5s .5s cubic-bezier(.5,0,.2,1) both}
@keyframes sweep{to{transform:scaleX(1)}}
.pbar{position:absolute;top:0;left:0;height:7px;background:#2F5D50;width:0;opacity:.9;
  animation:grow 14.55s linear forwards}
@keyframes grow{to{width:100%}}
</style></head><body class="wait">
<div id="bg"></div><div class="pbar"></div>
<section class="first" style="animation-duration:1.90s;animation-delay:0.00s"><p class="tx hook" style="animation-delay:0.12s">이력이 만든 위험은</p><p class="tx hook" style="animation-delay:0.24s">합병증 탓이 아니었다</p></section><section style="animation-duration:5.55s;animation-delay:2.20s"><p class="kick">매개는 미미했다</p><p class="tx lead" style="animation-delay:0.12s">정신과 이력, 출산 합병증</p><p class="tx sub" style="animation-delay:0.24s"><mark>둘 다 독립적인 위험 요인</mark></p><p class="tx sub" style="animation-delay:0.36s">하지만 합병증이 설명하는 부분은</p><p class="tx sub" style="animation-delay:0.48s">이력과 우울증 관계의 1% 미만</p></section><section style="animation-duration:4.45s;animation-delay:8.20s"><p class="kick">기억할 한 가지</p><p class="tx take" style="animation-delay:0.12s">정신과 이력이 남긴 위험은</p><p class="tx take" style="animation-delay:0.24s">출산 합병증 탓이 아니었다</p></section><section style="animation-duration:1.60s;animation-delay:12.95s"><p class="tx cta" style="animation-delay:0.12s">심리 논문 한 편 · @today.psy.paper</p></section>
</body></html>
