<!doctype html><html lang=ko><meta charset=utf-8><style>
@import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap');
* { margin:0; padding:0; box-sizing:border-box; }
.slide {
  width:1080px; height:1350px; position:relative; overflow:hidden;
  padding:120px 104px 132px; font-family:'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif;
  -webkit-font-smoothing:antialiased; text-align:left;
  word-break:keep-all; line-break:strict; overflow-wrap:break-word;
  display:flex; flex-direction:column;
}
.stack { display:flex; flex-direction:column; align-items:flex-start; width:100%; margin:auto 0; }
.kicker {
  font-family:'Gowun Batang', 'Apple SD Gothic Neo', serif; font-weight:700; font-size:34px;
  letter-spacing:0; margin-bottom:34px;
}
.title {
  font-family:'Gowun Batang', 'Apple SD Gothic Neo', serif; font-weight:700; font-size:82px;
  line-height:1.3; letter-spacing:-.005em;
}
.body {
  font-family:'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif; font-weight:400; font-size:37px;
  line-height:1.7; color:inherit; opacity:.92;
}
.body.sub { font-size:34px; opacity:.72; line-height:1.62; }
.body.cite { position:relative; padding-left:34px; }
.cite .mark { position:absolute; left:0; color:#D98763; }
.title + .body, .stype + .title + .body { margin-top:36px; }
.em { position:relative; white-space:nowrap; padding-bottom:.1em; }
.em .ul {
  position:absolute; left:-.05em; right:-.05em; bottom:-.12em;
  width:calc(100% + .1em); height:.42em; overflow:visible;
}
.illus { width:430px; margin-bottom:48px; }
.illus svg { width:100%; height:auto; display:block; }
.stype {
  display:inline-block;
  font-family:'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif; font-weight:600; font-size:22px;
  letter-spacing:.04em; color:#C15B3C;
  border:1.5px solid #C15B3C; border-radius:999px;
  padding:8px 20px; margin-bottom:28px; opacity:.9;
}
.takeaway {
  font-family:'Gowun Batang', 'Apple SD Gothic Neo', serif; font-weight:700; font-size:47px;
  line-height:1.5; letter-spacing:-.005em; color:#8A3C24;
}
.handle {
  font-family:'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif; font-weight:500; font-size:25px;
  margin-top:52px; opacity:.5; letter-spacing:.02em;
}
.stats { display:flex; flex-direction:column; gap:60px; }
.stat-v { font-family:'Gowun Batang', 'Apple SD Gothic Neo', serif; font-weight:700; font-size:96px;
  line-height:1; color:#C15B3C; }
.stat-l { font-size:31px; margin-top:16px; opacity:.68; }
.chart { display:flex; flex-direction:column; gap:34px; }
.c-row { display:flex; align-items:center; gap:26px; }
.c-l { width:230px; font-size:31px; opacity:.72; text-align:right; flex:none; }
.c-track { flex:1; }
.c-bar {
  display:flex; align-items:center; justify-content:flex-end;
  height:64px; background:#C15B3C; border-radius:12px;
  padding:0 20px; color:#fff; min-width:64px;
}
.c-v { font-size:29px; font-weight:600; font-variant-numeric:tabular-nums; }
.c-note { font-size:26px; opacity:.55; margin-top:40px; }
.bar {
  position:absolute; left:104px; right:104px; bottom:64px;
  display:flex; align-items:center; gap:18px;
}
.trk { flex:1; height:4px; border-radius:3px; overflow:hidden; }
.fil { height:100%; border-radius:3px; }
.bar span { font-size:23px; font-weight:500; font-variant-numeric:tabular-nums; }
</style><div class="slide" style="background:#F7F1E6;color:#2A211B"><div class="stack center"><div class="kicker" style="color:#C15B3C">기억할 한 가지</div><div class="takeaway">실험실 갈망은 그대로,<br>실생활 폭음은 줄었다</div></div><div class="bar"><div class="trk" style="background:rgba(0,0,0,.09)"><div class="fil" style="width:88%;background:#C15B3C"></div></div><span style="color:rgba(0,0,0,.32)">7/8</span></div></div>
