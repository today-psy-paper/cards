<!doctype html><html lang=ko><head><meta charset=utf-8>
<style>
@import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#F7F1E6}
body{font-family:'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif;color:#2A211B;-webkit-font-smoothing:antialiased}
#bg{position:absolute;inset:-6%;background:#F7F1E6;
  animation:drift 28.0s ease-in-out forwards}
@keyframes drift{from{transform:scale(1.01)}to{transform:scale(1.08) translateY(-1.4%)}}
section{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:210px 60px 350px;text-align:center;
  word-break:keep-all;white-space:nowrap;opacity:0;
  animation-name:seg;animation-timing-function:linear;animation-fill-mode:both}
@keyframes seg{
  0%{opacity:0;transform:translateY(22px) scale(.985)}
  8%{opacity:1;transform:none}
  87%{opacity:1;transform:none}
  100%{opacity:0;transform:translateY(-18px) scale(.99)}
}
.kick{font-family:'Gowun Batang', 'Apple SD Gothic Neo', serif;font-weight:700;font-size:31px;color:#C15B3C;
  letter-spacing:.06em;opacity:.85;margin-bottom:52px;
  animation:kickin .55s cubic-bezier(.16,1,.3,1) both}
@keyframes kickin{from{opacity:0;letter-spacing:.02em}to{opacity:.85;letter-spacing:.06em}}
.tx{animation:rise .55s cubic-bezier(.16,1,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.hook{font-family:'Gowun Batang', 'Apple SD Gothic Neo', serif;font-weight:700;font-size:72px;line-height:1.32;letter-spacing:-.015em;
  animation:hookin .7s cubic-bezier(.16,1,.3,1) both}
@keyframes hookin{from{opacity:0;transform:translateY(30px) scale(.92)}to{opacity:1;transform:none}}
.lead{font-size:50px;line-height:1.4;font-weight:700;color:#8A3C24;margin:8px 0 18px}
.sub{font-size:42px;line-height:1.46;font-weight:500;opacity:.86;margin:8px 0}
.take{font-family:'Gowun Batang', 'Apple SD Gothic Neo', serif;font-weight:700;font-size:57px;line-height:1.5;color:#8A3C24;margin:10px 0;
  letter-spacing:-.015em}
.cta{font-family:'Gowun Batang', 'Apple SD Gothic Neo', serif;font-weight:700;font-size:50px;line-height:1.4;opacity:.9}
mark{background:none;color:inherit;position:relative;white-space:nowrap;padding:0 .06em}
mark::before{content:"";position:absolute;left:0;right:0;bottom:.05em;top:.16em;z-index:-1;
  background:#C15B3C;opacity:.2;transform:scaleX(0);transform-origin:left;border-radius:2px;
  animation:sweep .5s .5s cubic-bezier(.5,0,.2,1) both}
@keyframes sweep{to{transform:scaleX(1)}}
.pbar{position:absolute;top:0;left:0;height:7px;background:#C15B3C;width:0;opacity:.9;
  animation:grow 28.00s linear forwards}
@keyframes grow{to{width:100%}}
</style></head><body>
<div id="bg"></div><div class="pbar"></div>
<section style="animation-duration:3.80s;animation-delay:0.00s"><p class="tx hook" style="animation-delay:0.12s">상담의 무엇이</p><p class="tx hook" style="animation-delay:0.24s">효과를 낼까</p></section><section style="animation-duration:5.65s;animation-delay:4.30s"><p class="kick">연구 결과</p><p class="tx lead" style="animation-delay:0.12s"><mark>사회적 지지 강화</mark>가 가장 큰 개선 효과</p><p class="tx sub" style="animation-delay:0.24s">행동 활성화·문제 관리도 도움이 됨</p><p class="tx sub" style="animation-delay:0.36s">이완 요법·인지 재구성은 오히려 악화</p></section><section style="animation-duration:5.65s;animation-delay:10.45s"><p class="kick">이 연구의 의미</p><p class="tx lead" style="animation-delay:0.12s">효과적 요소 중심으로 상담 설계 가능</p><p class="tx sub" style="animation-delay:0.24s">참가자 특성별 <mark>맞춤 효과 예측</mark> 가능</p><p class="tx sub" style="animation-delay:0.36s">공개 웹 앱에서 개인별 추정치 확인</p></section><section style="animation-duration:6.75s;animation-delay:16.75s"><p class="kick">기억할 한 가지</p><p class="tx take" style="animation-delay:0.12s">전문가가 아니어도</p><p class="tx take" style="animation-delay:0.24s">곁을 지켜주는 것이 도움이 된다는 것</p></section><section style="animation-duration:4.00s;animation-delay:24.00s"><p class="tx cta" style="animation-delay:0.12s">심리 논문 한 편 · @today.psy.paper</p></section>
</body></html>
